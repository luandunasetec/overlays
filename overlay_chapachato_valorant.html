    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Teko:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Teko', sans-serif;
            overflow: hidden;
        }

        .overlay-container {
            position: relative;
            width: 720px;
            height: 120px;
            background: #0d0e12;
            border: 2px solid #1a2234;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            overflow: visible;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(22, 101, 216, 0.2);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
            transform: translateZ(0);
            animation: overlayFloat 2.8s ease-in-out infinite alternate;
        }

        @keyframes overlayFloat {
            0% { transform: translate3d(0, 0px, 0) scale(1); }
            100% { transform: translate3d(0, -3px, 0) scale(1.002); }
        }

        .street-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(22, 101, 216, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
                linear-gradient(45deg, #090a0d 25%, #121620 25%, #121620 50%, #090a0d 50%, #090a0d 75%, #121620 75%, #121620 100%);
            background-size: 100% 100%, 100% 100%, 12px 12px;
            z-index: 1;
            overflow: hidden;
            border-radius: 2px;
        }

        .rank-top-badge {
            position: absolute;
            top: -18px;
            left: 35px;
            z-index: 10;
            background: linear-gradient(135deg, #181c26 0%, #0d1017 100%);
            border: 2px solid #f5cf42;
            padding: 4px 18px;
            display: none;
            align-items: center;
            gap: 10px;
            border-radius: 4px;
            box-shadow: 0 -4px 15px rgba(245, 207, 66, 0.25), 0 6px 15px rgba(0, 0, 0, 0.8);
            animation: rankGlowPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes rankGlowPulse {
            0% {
                border-color: #f5cf42;
                box-shadow: 0 -2px 10px rgba(245, 207, 66, 0.2), 0 4px 12px rgba(0, 0, 0, 0.8);
            }
            100% {
                border-color: #ffffff;
                box-shadow: 0 -4px 18px rgba(245, 207, 66, 0.5), 0 6px 16px rgba(0, 0, 0, 0.9);
            }
        }

        .rank-top-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(245, 207, 66, 0.8));
        }

        .rank-title {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #f5cf42;
            letter-spacing: 1.5px;
            line-height: 1;
            text-transform: uppercase;
        }

        .rank-divider {
            width: 2px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .rank-stats {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .rank-wins { color: #38ef7d; }
        .rank-losses { color: #ff4b2b; }
        .stat-sep { color: rgba(255, 255, 255, 0.3); font-weight: 400; }
        .rank-wr { color: #8b9bb4; font-weight: 700; margin-left: 2px; }

        .doodle-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .doodle-crown {
            position: absolute;
            top: 8px;
            left: 210px;
            width: 30px;
            height: 30px;
            stroke: #00d2ff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            animation: floatDoodle 3s ease-in-out infinite alternate, glowPulse 2s infinite alternate;
        }

        .doodle-crosshair {
            position: absolute;
            bottom: 12px;
            left: 20px;
            width: 28px;
            height: 28px;
            stroke: rgba(255, 255, 255, 0.4);
            fill: none;
            stroke-width: 2;
            animation: spinDoodle 12s linear infinite;
        }

        .doodle-arrow {
            position: absolute;
            top: 45px;
            left: 310px;
            width: 45px;
            height: 25px;
            stroke: #00d2ff;
            fill: none;
            stroke-width: 3;
            stroke-dasharray: 100;
            animation: dashDraw 2.5s ease-in-out infinite;
        }

        .doodle-tag {
            position: absolute;
            bottom: 8px;
            right: 280px;
            font-family: 'Permanent Marker', cursive;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            transform: rotate(-5deg);
            animation: flickerTag 4s infinite;
        }

        @keyframes floatDoodle {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-5px) rotate(5deg); }
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 2px #00d2ff); }
            100% { filter: drop-shadow(0 0 8px #00d2ff); }
        }

        @keyframes spinDoodle {
            100% { transform: rotate(360deg); }
        }

        @keyframes dashDraw {
            0% { stroke-dashoffset: 100; opacity: 0.2; }
            50% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: -100; opacity: 0.2; }
        }

        @keyframes flickerTag {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
            52% { opacity: 0.2; }
            54% { opacity: 0.8; }
        }

        .shine-sweep {
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.05) 30%, 
                rgba(255, 255, 255, 0.75) 50%, 
                rgba(255, 255, 255, 0.05) 70%, 
                transparent 100%
            );
            transform: skewX(-25deg);
            z-index: 3;
            animation: sweepWithPause 5s ease-in-out infinite;
        }

        @keyframes sweepWithPause {
            0% { left: -150%; }
            30% { left: 250%; }
            100% { left: 250%; }
        }

        .logo-wrapper {
            position: relative;
            z-index: 5;
            display: inline-block;
            transform-origin: 50% 50%;
            animation: logoFloatCentral 3s ease-in-out infinite alternate;
        }

        .logo-text {
            font-family: 'Permanent Marker', cursive;
            font-size: 50px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 
                3px 3px 0px #0e52b6,
                -2px -2px 0px #000,
                2px -2px 0px #000,
                -2px 2px 0px #000,
                0px 5px 15px rgba(0, 210, 255, 0.6);
            display: inline-block;
        }

        @keyframes logoFloatCentral {
            0% {
                transform: translateY(0px) rotate(-2deg);
                filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.3));
            }
            50% {
                transform: translateY(-5px) rotate(0deg);
                filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.6));
            }
            100% {
                transform: translateY(3px) rotate(2deg);
                filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.3));
            }
        }

        .social-badge {
            position: relative;
            z-index: 5;
            background: linear-gradient(135deg, #105bd8 0%, #08327a 100%);
            border: 2px solid #00d2ff;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: skewX(-12deg);
            box-shadow: -4px 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.2);
            animation: badgePulse 2s ease-in-out infinite alternate;
        }

        .social-badge-content {
            transform: skewX(-12deg);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-icons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-icons svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .social-handle {
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.6);
        }

        @keyframes badgePulse {
            0% { 
                border-color: #00d2ff; 
                box-shadow: -4px 4px 15px rgba(0, 0, 0, 0.5), 0 0 5px rgba(0, 210, 255, 0.2); 
            }
            100% { 
                border-color: #ffffff; 
                box-shadow: -4px 4px 15px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 210, 255, 0.6); 
            }
        }
    </style>

        async function fetchComFallback(targetUrl) {
            // Adiciona um timestamp para evitar que o proxy entregue cache velho
            const sep = targetUrl.includes('?') ? '&' : '?';
            const urlSemCache = `${targetUrl}${sep}_t=${Date.now()}`;

            // Reordena a lista colocando o último proxy que funcionou em primeiro lugar
            const ordemTentativas = [
                ...CORS_PROXIES.slice(ultimoProxyFuncional),
                ...CORS_PROXIES.slice(0, ultimoProxyFuncional)
            ];

            for (let i = 0; i < ordemTentativas.length; i++) {
                const proxy = ordemTentativas[i];
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000); // 8s por tentativa

                try {
                    const proxyUrl = proxy.buildUrl(urlSemCache);
                    const res = await fetch(proxyUrl, {
                        signal: controller.signal,
                        cache: 'no-store'
                    });

                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }

                    const rawText = await res.text();
                    const cleanText = proxy.extract(rawText).trim();

                    // Validação básica: garante que não veio vazio nem uma página HTML de erro do proxy
                    if (!cleanText || cleanText.startsWith('<!DOCTYPE') || cleanText.startsWith('<html')) {
                        throw new Error('Resposta HTML inválida do proxy');
                    }

                    // Salva o índice original deste proxy como preferencial
                    ultimoProxyFuncional = CORS_PROXIES.findIndex(p => p.nome === proxy.nome);
                    console.log(`[Proxy OK: ${proxy.nome}] ->`, cleanText);
                    return cleanText;

                } catch (erro) {
                    console.warn(`[Proxy Falhou: ${proxy.nome}]`, erro.message);
                } finally {
                    clearTimeout(timeout);
                }
            }

            throw new Error(`Todos os ${CORS_PROXIES.length} proxies falharam para: ${targetUrl}`);
        }

        const rankBadge = document.querySelector('.rank-top-badge');
        let verificacaoEmAndamento = false;

        async function updateOverlayData() {
            if (verificacaoEmAndamento) return;
            verificacaoEmAndamento = true;

            try {
                // 1. Consultar o jogo atual da live (DecAPI não precisa de CORS)
                const gameRes = await fetch(`${GAME_ENDPOINT}?_t=${Date.now()}`, { cache: 'no-store' });
                if (!gameRes.ok) throw new Error(`DecAPI HTTP ${gameRes.status}`);

                const gameName = (await gameRes.text()).trim().toUpperCase();
                const isValorant = gameName === 'VALORANT';

                rankBadge.style.display = isValorant ? 'flex' : 'none';
                console.log('[OBS] Jogo atual:', gameName, '| Rank visível:', isValorant);

                if (!isValorant) return;

                // 2. Atualizar Elo e título usando fallback de proxies CORS
                try {
                    const rawText = await fetchComFallback(MMR_ENDPOINT);
                    const parts = rawText.split(',');
                    const rankNameClean = parts[0].replace(/#\d+/, '').trim();

                    if (rankNameClean) {
                        document.getElementById('rank-title-text').textContent = rankNameClean.toUpperCase();
                        if (rankImages[rankNameClean]) {
                            document.getElementById('rank-icon-img').src = rankImages[rankNameClean];
                        }
                    }
                } catch (err) {
                    console.warn('Erro ao buscar MMR:', err.message);
                }

                // 3. Atualizar vitórias, derrotas e win rate usando fallback de proxies CORS
                try {
                    const rawHistory = await fetchComFallback(HISTORY_ENDPOINT);
                    const winsMatch = rawHistory.match(/(\d+)W/i);
                    const lossesMatch = rawHistory.match(/(\d+)L/i);
                    const wrMatch = rawHistory.match(/([\d.]+)%\s*WR/i);

                    if (winsMatch) document.getElementById('stat-wins').textContent = `${winsMatch[1]}W`;
                    if (lossesMatch) document.getElementById('stat-losses').textContent = `${lossesMatch[1]}L`;
                    if (wrMatch) document.getElementById('stat-wr').textContent = `${wrMatch[1]}% WR`;
                } catch (err) {
                    console.warn('Erro ao buscar histórico de partidas:', err.message);
                }

            } catch (err) {
                rankBadge.style.display = 'none';
                console.warn('Erro ao consultar o jogo na Twitch:', err.message);
            } finally {
                verificacaoEmAndamento = false;
            }
        }

        // Verifica imediatamente ao carregar e depois a cada 60 segundos.
        updateOverlayData();
        setInterval(updateOverlayData, 60000);
    </script>
