<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay - CHAPA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Teko:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --event-color: #00d2ff;
            --event-glow: rgba(0, 210, 255, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Teko', sans-serif;
            overflow: hidden;
        }

        .overlay-container {
            position: relative;
            width: 720px;
            height: 120px;
            background: #0d0e12;
            border: 2px solid #1a2234;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            overflow: visible;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(22, 101, 216, 0.2);
            will-change: transform, border-color, box-shadow;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
            transform: translateZ(0);
            animation: overlayFloat 2.8s ease-in-out infinite alternate;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* Destaque dinâmico no container inteiro durante um evento */
        .overlay-container.event-active {
            border-color: var(--event-color);
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.9),
                0 0 24px var(--event-glow),
                inset 0 0 18px var(--event-glow);
        }

        @keyframes overlayFloat {
            0% { transform: translate3d(0, 0px, 0) scale(1); }
            100% { transform: translate3d(0, -3px, 0) scale(1.002); }
        }

        .street-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(22, 101, 216, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
                linear-gradient(45deg, #090a0d 25%, #121620 25%, #121620 50%, #090a0d 50%, #090a0d 75%, #121620 75%, #121620 100%);
            background-size: 100% 100%, 100% 100%, 12px 12px;
            z-index: 1;
            overflow: hidden;
            border-radius: 2px;
        }

        /* Brilho de fundo temático que acende suavemente durante o alerta */
        .event-bg-tint {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 28% 50%, var(--event-glow) 0%, transparent 68%);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .overlay-container.event-active .event-bg-tint {
            opacity: 0.75;
        }

        /* Barra de tempo sutil na base do overlay */
        .event-timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: var(--event-color);
            box-shadow: 0 0 10px var(--event-color);
            transform-origin: left center;
            transform: scaleX(0);
            z-index: 6;
            pointer-events: none;
        }

        .event-timer-bar.running {
            animation: shrinkTimer 5s linear forwards;
        }

        @keyframes shrinkTimer {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(0); }
        }

        .rank-top-badge {
            position: absolute;
            top: -18px;
            left: 35px;
            z-index: 10;
            background: linear-gradient(135deg, #181c26 0%, #0d1017 100%);
            border: 2px solid #f5cf42;
            padding: 4px 18px;
            display: none;
            align-items: center;
            gap: 10px;
            border-radius: 4px;
            box-shadow: 0 -4px 15px rgba(245, 207, 66, 0.25), 0 6px 15px rgba(0, 0, 0, 0.8);
            animation: rankGlowPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes rankGlowPulse {
            0% {
                border-color: #f5cf42;
                box-shadow: 0 -2px 10px rgba(245, 207, 66, 0.2), 0 4px 12px rgba(0, 0, 0, 0.8);
            }
            100% {
                border-color: #ffffff;
                box-shadow: 0 -4px 18px rgba(245, 207, 66, 0.5), 0 6px 16px rgba(0, 0, 0, 0.9);
            }
        }

        .rank-top-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(245, 207, 66, 0.8));
        }

        .rank-title {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #f5cf42;
            letter-spacing: 1.5px;
            line-height: 1;
            text-transform: uppercase;
        }

        .rank-divider {
            width: 2px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .rank-stats {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .rank-wins { color: #38ef7d; }
        .rank-losses { color: #ff4b2b; }
        .stat-sep { color: rgba(255, 255, 255, 0.3); font-weight: 400; }
        .rank-wr { color: #8b9bb4; font-weight: 700; margin-left: 2px; }

        .doodle-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .doodle-crown {
            position: absolute;
            top: 8px;
            left: 210px;
            width: 30px;
            height: 30px;
            stroke: #00d2ff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            animation: floatDoodle 3s ease-in-out infinite alternate, glowPulse 2s infinite alternate;
        }

        .doodle-crosshair {
            position: absolute;
            bottom: 12px;
            left: 20px;
            width: 28px;
            height: 28px;
            stroke: rgba(255, 255, 255, 0.4);
            fill: none;
            stroke-width: 2;
            animation: spinDoodle 12s linear infinite;
        }

        .doodle-arrow {
            position: absolute;
            top: 45px;
            left: 310px;
            width: 45px;
            height: 25px;
            stroke: #00d2ff;
            fill: none;
            stroke-width: 3;
            stroke-dasharray: 100;
            animation: dashDraw 2.5s ease-in-out infinite;
        }

        .doodle-tag {
            position: absolute;
            bottom: 8px;
            right: 280px;
            font-family: 'Permanent Marker', cursive;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            transform: rotate(-5deg);
            animation: flickerTag 4s infinite;
        }

        @keyframes floatDoodle {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-5px) rotate(5deg); }
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 2px #00d2ff); }
            100% { filter: drop-shadow(0 0 8px #00d2ff); }
        }

        @keyframes spinDoodle {
            100% { transform: rotate(360deg); }
        }

        @keyframes dashDraw {
            0% { stroke-dashoffset: 100; opacity: 0.2; }
            50% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: -100; opacity: 0.2; }
        }

        @keyframes flickerTag {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
            52% { opacity: 0.2; }
            54% { opacity: 0.8; }
        }

        .shine-sweep {
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.05) 30%, 
                rgba(255, 255, 255, 0.75) 50%, 
                rgba(255, 255, 255, 0.05) 70%, 
                transparent 100%
            );
            transform: skewX(-25deg);
            z-index: 3;
            animation: sweepWithPause 5s ease-in-out infinite;
            pointer-events: none;
        }

        /* Flash instantâneo disparado na chegada de um evento */
        .shine-sweep.instant-flash {
            animation: instantFlashSweep 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes instantFlashSweep {
            0% { left: -120%; }
            100% { left: 220%; }
        }

        @keyframes sweepWithPause {
            0% { left: -150%; }
            30% { left: 250%; }
            100% { left: 250%; }
        }

        /* =========================================================
           ÁREA CENTRAL: LOGO PRINCIPAL VS ALERTA COM IMPACTO ELÁSTICO
           ========================================================= */
        .logo-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            min-width: 360px;
            height: 82px;
            transform-origin: 50% 50%;
            animation: logoFloatCentral 3s ease-in-out infinite alternate;
        }

        .logo-text {
            position: absolute;
            left: 0;
            font-family: 'Permanent Marker', cursive;
            font-size: 50px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 
                3px 3px 0px #0e52b6,
                -2px -2px 0px #000,
                2px -2px 0px #000,
                -2px 2px 0px #000,
                0px 5px 15px rgba(0, 210, 255, 0.6);
            transition: opacity 0.38s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.38s ease;
        }

        .logo-text.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0px);
            pointer-events: auto;
        }

        .logo-text.hidden {
            opacity: 0;
            transform: translate3d(-18px, 0, 0) scale(0.9);
            filter: blur(5px);
            pointer-events: none;
        }

        /* Caixa de Alerta com Selo Inclinado + Nome */
        .event-alert-box {
            position: absolute;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transform: translate3d(26px, 0, 0) scale(0.88);
            filter: blur(4px);
            pointer-events: none;
            transition:
                opacity 0.35s ease,
                transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.35s ease;
        }

        .event-alert-box.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0px);
        }

        .event-alert-box.hidden {
            opacity: 0;
            transform: translate3d(-22px, 0, 0) scale(0.92);
            filter: blur(4px);
        }

        /* Selo estilo "Street Tag" inclinado com a cor do evento */
        .event-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(13, 16, 23, 0.92);
            border: 1.5px solid var(--event-color);
            box-shadow: -3px 3px 0px var(--event-color), 0 0 12px var(--event-glow);
            padding: 2px 12px;
            transform: skewX(-12deg);
        }

        .event-type-label {
            transform: skewX(12deg);
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--event-color);
            text-shadow: 0 0 8px var(--event-glow);
            white-space: nowrap;
        }

        .event-user-name {
            font-family: 'Permanent Marker', cursive;
            font-size: 36px;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.05;
            letter-spacing: 1.5px;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow:
                3px 3px 0px #090a0d,
                -2px -2px 0px #000,
                2px -2px 0px #000,
                -2px 2px 0px #000,
                0px 4px 16px var(--event-glow);
        }

        @keyframes logoFloatCentral {
            0% {
                transform: translateY(0px) rotate(-1.5deg);
            }
            50% {
                transform: translateY(-4px) rotate(0deg);
            }
            100% {
                transform: translateY(3px) rotate(1.5deg);
            }
        }

        .social-badge {
            position: relative;
            z-index: 5;
            background: linear-gradient(135deg, #105bd8 0%, #08327a 100%);
            border: 2px solid #00d2ff;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: skewX(-12deg);
            box-shadow: -4px 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.2);
            animation: badgePulse 2s ease-in-out infinite alternate;
        }

        .social-badge-content {
            transform: skewX(-12deg);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-icons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-icons svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .social-handle {
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.6);
        }

        @keyframes badgePulse {
            0% { 
                border-color: #00d2ff; 
                box-shadow: -4px 4px 15px rgba(0, 0, 0, 0.5), 0 0 5px rgba(0, 210, 255, 0.2); 
            }
            100% { 
                border-color: #ffffff; 
                box-shadow: -4px 4px 15px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 210, 255, 0.6); 
            }
        }
    </style>
</head>

        const HISTORY_ENDPOINT = 'https://vaccie.pythonanywhere.com/match_history/chapachato/Sem/na/pc';

        function extrairRankValido(texto) {
            if (!texto || typeof texto !== 'string') return null;
            const partePrincipal = texto.split(',')[0].replace(/#\d+/, '').trim().toLowerCase();
            for (const rankOficial of Object.keys(rankImages)) {
                if (partePrincipal === rankOficial.toLowerCase()) {
                    return rankOficial;
                }
            }
            return null;
        }

        function aplicarRankNaTela(rankName) {
            const rankFinal = (rankName && rankImages[rankName]) ? rankName : "Immortal 1";
            document.getElementById('rank-title-text').textContent = rankFinal.toUpperCase();
            document.getElementById('rank-icon-img').src = rankImages[rankFinal];
        }

        const CORS_PROXIES = [

        let ultimoProxyFuncional = 0;

        async function fetchComFallback(targetUrl, validatorFn) {
            const sep = targetUrl.includes('?') ? '&' : '?';
            const urlSemCache = `${targetUrl}${sep}_t=${Date.now()}`;

            const ordemTentativas = [
                ...CORS_PROXIES.slice(ultimoProxyFuncional),
                ...CORS_PROXIES.slice(0, ultimoProxyFuncional)
            ];

            for (let i = 0; i < ordemTentativas.length; i++) {
                const proxy = ordemTentativas[i];
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);

                try {
                    const proxyUrl = proxy.buildUrl(urlSemCache);
                    const res = await fetch(proxyUrl, {
                        signal: controller.signal,
                        cache: 'no-store'
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const rawText = await res.text();
                    const cleanText = proxy.extract(rawText).trim();

                    if (
                        !cleanText ||
                        cleanText.startsWith('<!DOCTYPE') ||
                        cleanText.startsWith('<html') ||
                        cleanText.startsWith('{') ||
                        /too many requests|rate limit|error|blocked|forbidden|429/i.test(cleanText)
                    ) {
                        throw new Error(`Resposta inválida/erro no corpo: "${cleanText.slice(0, 60)}"`);
                    }

                    if (validatorFn && !validatorFn(cleanText)) {
                        throw new Error(`Formato inesperado: "${cleanText.slice(0, 60)}"`);
                    }

                    ultimoProxyFuncional = CORS_PROXIES.findIndex(p => p.nome === proxy.nome);
                    return cleanText;

                } catch (erro) {
                    console.warn(`[Proxy Falhou: ${proxy.nome}]`, erro.message);
                } finally {
                    clearTimeout(timeout);
                }
            }

            throw new Error(`Todos os ${CORS_PROXIES.length} proxies falharam para: ${targetUrl}`);
        }

        const rankBadge = document.querySelector('.rank-top-badge');
        let verificacaoEmAndamento = false;

        async function updateOverlayData() {
            if (verificacaoEmAndamento) return;
            verificacaoEmAndamento = true;

            try {
                const gameRes = await fetch(`${GAME_ENDPOINT}?_t=${Date.now()}`, { cache: 'no-store' });
                if (!gameRes.ok) throw new Error(`DecAPI HTTP ${gameRes.status}`);

                const gameName = (await gameRes.text()).trim().toUpperCase();
                const isValorant = gameName === 'VALORANT';

                rankBadge.style.display = isValorant ? 'flex' : 'none';
                if (!isValorant) return;

                try {
                    const rawText = await fetchComFallback(
                        MMR_ENDPOINT,
                        (texto) => extrairRankValido(texto) !== null
                    );
                    aplicarRankNaTela(extrairRankValido(rawText));
                } catch (err) {
                    console.warn('Falha ao obter MMR válido. Aplicando fallback Immortal 1:', err.message);
                    aplicarRankNaTela("Immortal 1");
                }

                try {
                    const rawHistory = await fetchComFallback(
                        HISTORY_ENDPOINT,
                        (texto) => /(\d+)W/i.test(texto) && /(\d+)L/i.test(texto)
                    );

                    const winsMatch = rawHistory.match(/(\d+)W/i);
                    const lossesMatch = rawHistory.match(/(\d+)L/i);
                    const wrMatch = rawHistory.match(/([\d.]+)%\s*WR/i);

                    if (winsMatch) document.getElementById('stat-wins').textContent = `${winsMatch[1]}W`;
                    if (lossesMatch) document.getElementById('stat-losses').textContent = `${lossesMatch[1]}L`;
                    if (wrMatch) document.getElementById('stat-wr').textContent = `${wrMatch[1]}% WR`;
                } catch (err) {
                    console.warn('Erro ao buscar histórico de partidas:', err.message);
                }

            } catch (err) {
                rankBadge.style.display = 'none';
                console.warn('Erro ao consultar o jogo na Twitch:', err.message);
            } finally {
                verificacaoEmAndamento = false;
            }
        }

        updateOverlayData();
        setInterval(updateOverlayData, 60000);

        // =========================================================
        // 2. SISTEMA DE EVENTOS COM REAÇÃO DE BORDA, FLASH E SELO
        // =========================================================
        const urlParams = new URLSearchParams(window.location.search);
        const STREAMELEMENTS_JWT_TOKEN = urlParams.get("jwt") || "";

        // Paleta dinâmica por tipo de evento
        const EVENT_THEMES = {
            follow: { color: "#00d2ff", glow: "rgba(0, 210, 255, 0.45)" },
            sub:    { color: "#f5cf42", glow: "rgba(245, 207, 66, 0.5)" },
            gift:   { color: "#ffb703", glow: "rgba(255, 183, 3, 0.5)" },
            raid:   { color: "#ff4b2b", glow: "rgba(255, 75, 43, 0.55)" },
            bits:   { color: "#a855f7", glow: "rgba(168, 85, 247, 0.5)" },
            tip:    { color: "#38ef7d", glow: "rgba(56, 239, 125, 0.5)" }
        };

        const filaEventos = [];
        let exibindoEvento = false;

        const containerEl = document.getElementById("overlay-container");
        const shineEl = document.getElementById("shine-sweep");
        const timerBarEl = document.getElementById("event-timer-bar");
        const mainLogoEl = document.getElementById("main-logo-text");
        const alertBoxEl = document.getElementById("event-alert-box");
        const alertLabelEl = document.getElementById("event-type-label");
        const alertUserEl = document.getElementById("event-user-name");

        function dispararFlashBrilho() {
            shineEl.classList.remove("instant-flash");
            void shineEl.offsetWidth; // força reflow para reiniciar a animação
            shineEl.classList.add("instant-flash");
            setTimeout(() => {
                shineEl.classList.remove("instant-flash");
            }, 800);
        }

        function reiniciarBarraTempo() {
            timerBarEl.classList.remove("running");
            void timerBarEl.offsetWidth;
            timerBarEl.classList.add("running");
        }

        function dispararAlerta(tipo, label, usuario) {
            filaEventos.push({ tipo, label, usuario });
            processarFilaEventos();
        }

        function processarFilaEventos() {
            if (exibindoEvento || filaEventos.length === 0) return;

            exibindoEvento = true;
            const evento = filaEventos.shift();
            const tema = EVENT_THEMES[evento.tipo] || EVENT_THEMES.follow;

            // Aplica a cor temática nas variáveis CSS do overlay
            document.documentElement.style.setProperty("--event-color", tema.color);
            document.documentElement.style.setProperty("--event-glow", tema.glow);

            alertLabelEl.textContent = evento.label;
            alertUserEl.textContent = evento.usuario;

            // Acende a borda do overlay e dispara o flash
            containerEl.classList.add("event-active");
            dispararFlashBrilho();

            // Recua o nome principal com blur
            mainLogoEl.classList.remove("visible");
            mainLogoEl.classList.add("hidden");

            // Entra o alerta com impacto elástico
            setTimeout(() => {
                alertBoxEl.classList.remove("hidden");
                alertBoxEl.classList.add("visible");
                reiniciarBarraTempo();
            }, 260);

            // Mantém o alerta por 5 segundos
            setTimeout(() => {
                alertBoxEl.classList.remove("visible");
                alertBoxEl.classList.add("hidden");
                timerBarEl.classList.remove("running");

                setTimeout(() => {
                    if (filaEventos.length > 0) {
                        exibindoEvento = false;
                        processarFilaEventos();
                    } else {
                        containerEl.classList.remove("event-active");
                        mainLogoEl.classList.remove("hidden");
                        mainLogoEl.classList.add("visible");
                        exibindoEvento = false;
                    }
                }, 360);
            }, 5000);
        }

        // =========================================================
// CONEXÃO ANÔNIMA AO CHAT PÚBLICO DA TWITCH (SEM TOKEN)
// Captura: Subs, Resubs, Gift Subs, Raids, Bits e Bots de Follow
// =========================================================
		const TWITCH_CHANNEL = "chapachato";

		function parseIrcTags(tagString) {
			const tags = {};
			if (!tagString) return tags;
			tagString.split(";").forEach(part => {
				const [key, val] = part.split("=");
				tags[key] = val ? val.replace(/\\s/g, " ") : "";
			});
			return tags;
		}

		function conectarTwitchChatPublico() {
			const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

			ws.onopen = () => {
				console.log(`[Twitch IRC] Conectado anonimamente ao canal #${TWITCH_CHANNEL}`);
				// Solicita tags estendidas da Twitch (onde vêm os dados de Sub, Raid e Bits)
				ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
				// Login anônimo oficial da Twitch (não precisa de senha nem OAuth)
				const randomId = Math.floor(10000 + Math.random() * 89999);
				ws.send("PASS SCHMOOPIIE");
				ws.send(`NICK justinfan${randomId}`);
				ws.send(`JOIN #${TWITCH_CHANNEL.toLowerCase()}`);
			};

			ws.onmessage = (event) => {
				const lines = event.data.split("\r\n");

				for (const line of lines) {
					if (!line) continue;

					// Responde ao PING da Twitch para manter a conexão viva
					if (line.startsWith("PING")) {
						ws.send("PONG :tmi.twitch.tv");
						continue;
					}

					// Separa as tags (@badge-info=...;msg-id=sub;...) do restante da linha
					let tags = {};
					let rest = line;
					if (line.startsWith("@")) {
						const spaceIdx = line.indexOf(" ");
						tags = parseIrcTags(line.slice(1, spaceIdx));
						rest = line.slice(spaceIdx + 1);
					}

					// 1. EVENTOS NATIVOS DA TWITCH (SUB, RESUB, GIFT SUB, RAID)
					if (rest.includes(" USERNOTICE ")) {
						const msgId = tags["msg-id"];
						const displayName = tags["display-name"] || tags["login"] || "Alguém";

						if (msgId === "sub") {
							dispararAlerta("sub", "★ NOVO SUB", displayName);
						} else if (msgId === "resub") {
							const meses = tags["msg-param-cumulative-months"] || 1;
							dispararAlerta("sub", `★ RESUB • ${meses} MESES`, displayName);
						} else if (msgId === "subgift") {
							const destinatario = tags["msg-param-recipient-display-name"] || "um viewer";
							dispararAlerta("gift", `🎁 DEU SUB P/ ${destinatario}`, displayName);
						} else if (msgId === "submysterygift") {
							const qtd = tags["msg-param-mass-gift-count"] || 1;
							dispararAlerta("gift", `🎁 PRESENTEOU ${qtd} SUBS`, displayName);
						} else if (msgId === "raid") {
							const viewers = tags["msg-param-viewerCount"] || 0;
							dispararAlerta("raid", `⚡ RAID • ${viewers} VIEWERS`, displayName);
						}
					}

					// 2. BITS / CHEER E MENSAGENS DE BOT DE FOLLOW NO CHAT
					if (rest.includes(" PRIVMSG ")) {
						const displayName = tags["display-name"] || "Viewer";

						// Se a mensagem contém Bits
						if (tags["bits"]) {
							const bitsAmount = parseInt(tags["bits"], 10);
							if (bitsAmount > 0) {
								dispararAlerta("bits", `💎 ENVIOU ${bitsAmount} BITS`, displayName);
							}
						}

						// Opcional: Captura aviso de Follow caso algum bot (StreamElements, Nightbot, etc.) anuncie no chat
						const botUser = (tags["login"] || displayName).toLowerCase();
						if (["streamelements", "nightbot", "fossabot", "streamlabs"].includes(botUser)) {
							const msgMatch = rest.match(/PRIVMSG #\w+ :(.+)/);
							const textoChat = msgMatch ? msgMatch[1] : "";
							// Exemplo: "Obrigado pelo follow, Fulano!" ou "Fulano acabou de seguir!"
							const followMatch = textoChat.match(/(?:follow(?:ing)?|seguir|seguiu)[,\s:!]+@?([a-zA-Z0-9_]{3,25})/i)
											 || textoChat.match(/@?([a-zA-Z0-9_]{3,25})\s+(?:acabou de seguir|just followed)/i);
							if (followMatch && followMatch[1]) {
								dispararAlerta("follow", "★ NOVO FOLLOW", followMatch[1]);
							}
						}
					}
				}
			};

			ws.onclose = () => {
				console.warn("[Twitch IRC] Conexão encerrada. Reconectando em 5s...");
				setTimeout(conectarTwitchChatPublico, 5000);
			};
		}

		conectarTwitchChatPublico();
    </script>
